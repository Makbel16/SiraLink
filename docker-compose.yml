version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: siralink-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: siralink
      POSTGRES_PASSWORD: siralink_secret
      POSTGRES_DB: siralink_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siralink -d siralink_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
