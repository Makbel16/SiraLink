services:
  - type: web
    name: siralink-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false
      - key: UPLOAD_BUCKET
        sync: false
      - key: UPLOAD_REGION
        sync: false
      - key: UPLOAD_ACCESS_KEY
        sync: false
      - key: UPLOAD_SECRET_KEY
        sync: false
